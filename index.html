<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04080a" />
    <meta name="description" content="Drift an old wooden rowboat down a narrow, moonlit jungle waterway." />
    <title>Jungle Sailor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060d10'/%3E%3Ccircle cx='38' cy='22' r='10' fill='%23e8e4d6'/%3E%3Cpath d='M12 44h40M18 50h28' stroke='%23e8e4d6' stroke-width='3' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Boat ride through a jungle waterway"></canvas>

    <div class="hud" id="hud">
      <div class="counter">
        <div class="stat" aria-label="Distance travelled">
          <span class="counter-label">Distance</span>
          <span class="counter-value" id="distance">0 m</span>
        </div>
        <div class="stat" aria-label="Moon lotus blossoms gathered">
          <span class="counter-label">Lotus</span>
          <span class="counter-value" id="lotus"><svg viewBox="0 0 24 24" aria-hidden="true" class="lotus-icon"><path d="M12 5.5c-1.8 2-2.6 4-2.6 6.2 0 2.1 1 3.6 2.6 4.8 1.6-1.2 2.6-2.7 2.6-4.8 0-2.2-.8-4.2-2.6-6.2Z" /><path d="M9.6 16.2C7.2 15.8 5 14.3 3.5 11.8c2.2-.4 4.4 0 6.2 1.2M14.4 16.2c2.4-.4 4.6-1.9 6.1-4.4-2.2-.4-4.4 0-6.2 1.2M5 18.5h14" /></svg><span id="lotus-count">0</span></span>
        </div>
      </div>

      <div class="toolbar">
        <div class="segmented" role="group" aria-label="Weather">
          <button type="button" data-weather="night" aria-pressed="true" title="Moonlit night" aria-label="Moonlit night">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" /></svg>
          </button>
          <button type="button" data-weather="dawn" aria-pressed="false" title="Warm dawn" aria-label="Warm dawn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 16a5 5 0 0 1 10 0" />
              <path d="M3 19.5h18M12 4.5v3M4.6 9.1l2 1.6M19.4 9.1l-2 1.6M2.5 16h2M19.5 16h2" />
            </svg>
          </button>
          <button type="button" data-weather="rain" aria-pressed="false" title="Overcast rain" aria-label="Overcast rain">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 15.5h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.3A3.4 3.4 0 0 0 7 15.5Z" />
              <path d="M8.5 18.5 7.5 21M12.5 18.5l-1 2.5M16.5 18.5l-1 2.5" />
            </svg>
          </button>
        </div>
        <button type="button" class="icon-button" id="sound" aria-pressed="false" title="Ambient sound" aria-label="Ambient sound">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="sound-off">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="m16 9.5 5 5M21 9.5l-5 5" />
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="sound-on">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" />
          </svg>
        </button>
        <button type="button" class="icon-button" id="fullscreen" title="Fullscreen" aria-label="Fullscreen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
          </svg>
        </button>
      </div>

      <p class="hint" id="hint"></p>
    </div>

    <div class="stick" id="stick" aria-hidden="true"><div class="knob" id="knob"></div></div>

    <div class="loader" id="loader">
      <div class="loader-title">Jungle Sailor</div>
      <div class="loader-sub" id="loader-sub">Charting the river…</div>
    </div>

    <noscript><p class="noscript">Jungle Sailor needs JavaScript and WebGL 2.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
